<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>

  <div class="card">
    <img class="card__hero" src="./images/illustration-hero.svg" alt="Kobieta słuchająca muzyki">

    <div class="card__body">
      <h1 class="card__title">Order Summary</h1>
      <p class="card__desc">
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>

      <div class="plan-box">
        <img class="plan-box__icon" src="./images/icon-music.svg" alt="Ikona muzyki">
        <div class="plan-box__info">
          <p class="plan-box__name">Annual Plan</p>
          <p class="plan-box__price">$59.99/year</p>
        </div>
        <a href="#" class="plan-box__change">Change</a>
      </div>

      <a href="#" class="btn-payment">Proceed to Payment</a>
      <a href="#" class="btn-cancel">Cancel Order</a>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

</body>
</html>
